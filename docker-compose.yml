services:
  db:
    image: postgres:16-alpine
    container_name: miraiwerk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: miraiwerk
      POSTGRES_PASSWORD: miraiwerk_dev_pw
      POSTGRES_DB: miraiwerk
    ports:
      - "55434:5432"
    volumes:
      - miraiwerk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miraiwerk -d miraiwerk"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  miraiwerk_pgdata:
